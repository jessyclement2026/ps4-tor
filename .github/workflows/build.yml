name: Build PS4 Tor Payload

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            build-essential \
            clang-18 \
            lld-18 \
            llvm-18 \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            meson \
            socat \
            git \
            wget \
            unzip \
            python3

      - name: Download ps4-payload-sdk
        run: |
          wget -q https://github.com/ps4-payload-dev/sdk/releases/latest/download/ps4-payload-sdk.zip
          unzip -oq ps4-payload-sdk.zip

      - name: Build payload
        env:
          PS4SDK: ${{ github.workspace }}/ps4-payload-sdk
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload tor-ps4.elf artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-ps4-elf
          path: tor-ps4.elf
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PS4 Tor Daemon Payload ${{ github.ref_name }} (tor-ps4.elf)
          files: tor-ps4.elf
          generate_release_notes: true
          body: |
            ## Native C-Tor Background Daemon for Jailbroken PS4 (`tor-ps4.elf`)

            A standalone native C-Tor background daemon payload compiled for Orbis OS (`x86_64-pc-freebsd9`) to provide local SOCKS5, HTTP Tunnel, and Tor DNS proxies.

            ### Key Features
            - **Pre-compiled Payload:** Statically linked with native C-Tor, OpenSSL, libevent, and zlib.
            - **Proxies & Tor DNS:** SOCKS5 (`127.0.0.1:9050`), HTTP Tunnel (`127.0.0.1:8118`), and built-in Tor DNS (`127.0.0.1:53`) with `.onion` automapping (`127.192.0.0/10`) and automatic Sony/PSN server blocking. To prevent DNS leaks and keep Sony servers blocked, users **must** use **Custom** network setup with both **Primary DNS** and **Secondary DNS** set to `127.0.0.1` (and Proxy Server set to `127.0.0.1`, Port `8118`).
            - **Config & Memory:** Auto-generates settings in `/data/tor/torrc` and uses a thread-safe recycling free-list allocator inside a single `mmap` VMA to prevent OOM crashes.

            ### Quick Start
            1. **Upload:** Copy `tor-ps4.elf` via GoldHEN FTP (port `2121`) to `/data/payloads/tor-ps4.elf`.
            2. **Launch:** Run `tor-ps4.elf` from GoldHEN PayLoader / LaunchPad.
            3. **PS4 Network Setup (Optional System Proxy):** Choose **Custom** → DNS Manual (`127.0.0.1` / `127.0.0.1`) → Proxy Server Use (`127.0.0.1`, Port `8118`).
            4. **Verify:** Wait ~15–20 seconds for bootstrap (`Bootstrapped 100%`), viewable via FTP at `/data/tor/tor.log`.

            ### Companion Browser & Safety Warning
            - **`.onion` Browsing:** Stock PS4 browser blocks `.onion` domains over port `8118`; use **[webtor-ps4](https://github.com/jessyclement2026/webtor-ps4)** for `.onion` and modern HTTPS support.
            - **⚠️ Warning:** Disable **System Software Updates** in **PS4 Settings → System → Automatic Downloads** to prevent accidental firmware upgrades.
