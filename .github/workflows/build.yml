name: Build PS4 Tor Payload

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            build-essential \
            clang-18 \
            lld-18 \
            llvm-18 \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            meson \
            socat \
            git \
            wget \
            unzip \
            python3

      - name: Download ps4-payload-sdk
        run: |
          wget -q https://github.com/ps4-payload-dev/sdk/releases/latest/download/ps4-payload-sdk.zip
          unzip -oq ps4-payload-sdk.zip

      - name: Build payload
        env:
          PS4SDK: ${{ github.workspace }}/ps4-payload-sdk
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload tor-ps4.elf artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-ps4-elf
          path: tor-ps4.elf
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tor-ps4.elf
          generate_release_notes: true
